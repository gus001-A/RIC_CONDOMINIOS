<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0F2A47">
    <title>Sin conexión · RIC Condominios</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f3f6fa; color: #0f2a47; }
        .tarjeta { width: 100%; max-width: 380px; background: #fff; border: 1px solid #e1e8f0; border-radius: 20px;
            padding: 32px 24px; text-align: center; box-shadow: 0 16px 40px rgba(15, 42, 71, 0.1); }
        .ic { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 18px; display: grid; place-items: center;
            background: #fff4e0; color: #b97800; font-size: 30px; }
        h1 { font-size: 20px; margin: 0 0 8px; }
        p { margin: 0 0 22px; color: #5d7085; line-height: 1.5; font-size: 14.5px; }
        button { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 15px; font-weight: 700;
            color: #fff; background: linear-gradient(135deg, #1a3a5c, #1a5a96); cursor: pointer; }
        small { display: block; margin-top: 14px; color: #8193a6; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <div class="ic">📶</div>
        <h1>Sin conexión a internet</h1>
        <p>No pudimos llegar al sistema del condominio. Revisa tu Wi-Fi o datos móviles e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
        <small>Se reintentará solo cuando vuelva la conexión.</small>
    </div>
    <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
