; Límites de subida para el servidor de desarrollo de RIC Condominios
; (se carga con PHP_INI_SCAN_DIR desde .claude/launch.json; no toca el php.ini de WAMP).
; Las alertas de seguridad aceptan videos de hasta 50 MB; en producción hay que
; configurar lo mismo en el php.ini del servidor.
upload_max_filesize = 64M
post_max_size = 200M
max_file_uploads = 20
